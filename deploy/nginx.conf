# Dylan Dog Tracker - Nginx site config
#
# Copy to /etc/nginx/sites-available/dd-tracker, then:
#   ln -s /etc/nginx/sites-available/dd-tracker /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Check the PHP-FPM socket path with: ls /run/php/

server {
    listen 80;
    listen [::]:80;
    server_name dd-tracker.duckdns.org;

    root /var/www/dd-tracker/public;
    index index.html;

    # Static files first, then PHP.
    location / {
        try_files $uri $uri/ =404;
    }

    # Only api.php is executed. This exact-match location wins over the
    # regex below, so no other PHP file can ever run.
    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Optional: put the whole site behind a login. Create the file with:
    #   htpasswd -c /etc/nginx/.htpasswd yourname
    # auth_basic "Dylan Dog Tracker";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
